name: PyongLIVE D1 Schema Repair
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pyonglive-d1-schema.yml"
permissions:
  contents: read
jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify configured database identity
        shell: bash
        run: |
          node -e "const c=require('./wrangler.jsonc'); const d=c.d1_databases?.[0]; if(!d || d.database_name!=='pyonglive-db' || d.database_id!=='23bcd209-8b76-4c0c-978f-872258bb61b9') { console.error('D1 config identity mismatch; stopping.'); process.exit(1); } console.log('D1 config identity verified:', d.database_name, d.database_id)"
      - name: List remote migrations before applying
        run: npx wrangler d1 migrations list pyonglive-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - name: Apply pending migrations to the existing remote database
        run: npx wrangler d1 migrations apply pyonglive-db --remote --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - name: Verify events table and migration ledger
        run: npx wrangler d1 execute pyonglive-db --remote --json --command "SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name; SELECT * FROM d1_migrations ORDER BY id;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - name: Typecheck
        run: npm run typecheck
