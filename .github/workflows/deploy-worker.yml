name: Deploy PyongLive Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: pyonglive-worker-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Create a Cloudflare API token with Account > Workers Scripts > Edit for the PyongLive account."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing repository variable CF_ACCOUNT_ID. Set it to the 32-character Cloudflare account ID."; exit 1; }
          [[ "$CF_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "::error::CF_ACCOUNT_ID must be 32 hexadecimal characters."; exit 1; }

      - name: Install dependencies and typecheck
        run: |
          npm install
          npm run typecheck

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://pyonglive-api.eddiebillions85.workers.dev/health -o /tmp/health.json; then
              if node -e 'const x=require("/tmp/health.json");process.exit(x.ok===true&&x.service==="pyonglive-api"?0:1)'; then
                echo "PASS: deployed production Worker health check."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Production health check did not pass after deployment."
          exit 1
