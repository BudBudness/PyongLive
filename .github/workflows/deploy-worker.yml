name: Deploy PyongLive Worker
# Production E2E is triggered after each successful deployment.
# Re-run deployment to validate the bounded FFmpeg setup in production E2E.
# Trigger isolated E2E concurrency group.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "src/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: pyonglive-worker-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Validate token identity here; Wrangler performs the authoritative resource/write authorization check.
      - name: Validate deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing repository variable CF_ACCOUNT_ID."; exit 1; }
          [[ "$CF_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || { echo "::error::CF_ACCOUNT_ID must be 32 hexadecimal characters."; exit 1; }
          verify="$(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CF_API_TOKEN")"
          echo "$verify" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);if(!x.success||x.result?.status!=="active"){console.error("::error::Cloudflare API token verification failed or token is not active.");process.exit(1)}console.log("PASS: Cloudflare API token is active.")}catch{console.error("::error::Cloudflare token verification returned invalid JSON.");process.exit(1)}})'

      - name: Install dependencies and typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Apply pending D1 migrations before deploying code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list pyonglive-db --remote
          npx wrangler d1 migrations apply pyonglive-db --remote
          npx wrangler d1 execute pyonglive-db --remote --command "SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name; SELECT * FROM d1_migrations ORDER BY id;"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production health and events API
        run: |
          set -euo pipefail
          health_url="https://pyonglive-api.eddiebillions85.workers.dev/health"
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --max-time 20 -H "Accept: application/json" -D /tmp/health-headers.txt -o /tmp/health-body.txt -w '%{http_code}' "$health_url" || true)"
            if [[ "$status" == "200" ]] && node -e 'try{const x=JSON.parse(require("fs").readFileSync("/tmp/health-body.txt","utf8"));process.exit(x.ok===true&&x.service==="pyonglive-api"?0:1)}catch{process.exit(1)}'; then
              echo "PASS: production health endpoint returned HTTP 200 JSON."
              break
            fi
            echo "Health attempt $attempt/12 returned HTTP ${status:-unknown}."
            if [[ "$attempt" == "12" ]]; then
              echo "Relevant response headers:"
              grep -iE '^(HTTP/|content-type:|location:|server:|cf-ray:|cf-mitigated:)' /tmp/health-headers.txt || true
              echo "Response body (first 500 characters):"
              head -c 500 /tmp/health-body.txt || true
              echo
              echo "::error::Production health check failed; response diagnostics are above."
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error https://pyonglive-api.eddiebillions85.workers.dev/api/events -o /tmp/events.json
          node -e 'const x=require("/tmp/events.json");if(!Array.isArray(x.events))process.exit(1);console.log("PASS: production events API returned valid JSON with "+x.events.length+" events.")'
