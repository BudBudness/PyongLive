name: Cloudflare D1 Migration and Persistence Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/d1-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema and verify event write/read/update/delete
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_EDIT_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: 23bcd209-8b76-4c0c-978f-872258bb61b9
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::Add repository secret CLOUDFLARE_D1_EDIT_TOKEN with Cloudflare D1 Edit permission. Keep CLOUDFLARE_API_TOKEN read-only for inventory audits."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::CF_ACCOUNT_ID is missing."; exit 1; }
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { randomUUID } from "node:crypto";

          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}/query`;
          const headers = { authorization: `Bearer ${process.env.CF_API_TOKEN}`, "content-type": "application/json" };

          async function query(sql, params = []) {
            const response = await fetch(base, { method: "POST", headers, body: JSON.stringify({ sql, params }) });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const details = (payload.errors ?? []).map((e) => e.message).filter(Boolean).join("; ");
              throw new Error(`D1 query failed (${response.status}): ${details || "Cloudflare API returned success=false"}`);
            }
            return payload.result;
          }

          const migration = await readFile("migrations/0001_init.sql", "utf8");
          for (const statement of migration.split(";").map(s => s.trim()).filter(Boolean)) await query(statement);
          console.log("PASS: schema migration is applied (idempotent).");

          const id = `smoke-${randomUUID()}`;
          const createdAt = new Date().toISOString();
          try {
            await query("INSERT INTO events (id, title, description, status, scheduled_at, created_at) VALUES (?, ?, ?, 'scheduled', ?, ?)", [id, "PyongLive persistence smoke test", "Temporary automated test record", null, createdAt]);
            const read = await query("SELECT id, title, status FROM events WHERE id = ?", [id]);
            const row = read?.[0]?.results?.[0];
            if (!row || row.id !== id || row.title !== "PyongLive persistence smoke test" || row.status !== "scheduled") throw new Error("INSERT/SELECT verification failed.");
            console.log("PASS: event INSERT and SELECT.");

            await query("UPDATE events SET status = 'ended', ended_at = ? WHERE id = ?", [new Date().toISOString(), id]);
            const updated = await query("SELECT status FROM events WHERE id = ?", [id]);
            if (updated?.[0]?.results?.[0]?.status !== "ended") throw new Error("UPDATE verification failed.");
            console.log("PASS: event UPDATE.");

            await query("DELETE FROM events WHERE id = ?", [id]);
            const deleted = await query("SELECT id FROM events WHERE id = ?", [id]);
            if (deleted?.[0]?.results?.length) throw new Error("DELETE verification failed.");
            console.log("PASS: event DELETE and cleanup.");
          } catch (error) {
            try { await query("DELETE FROM events WHERE id = ?", [id]); } catch {}
            throw error;
          }
          NODE
