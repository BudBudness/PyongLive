name: PyongLIVE Setup & Operations Agent

on:
  workflow_dispatch:
    inputs:
      include_stream_check:
        description: "Check Cloudflare Stream API access (read-only)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pyonglive-ops-agent
  cancel-in-progress: false

jobs:
  audit:
    name: Audit and diagnose Cloudflare readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration without exposing secrets
        id: config
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          INCLUDE_STREAM: ${{ inputs.include_stream_check }}
        shell: bash
        run: |
          set -uo pipefail
          echo "## PyongLIVE Operations Agent" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only audit. This run will not create, modify, deploy, or delete Cloudflare resources." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          config_ok=true
          if [[ -z "${CF_API_TOKEN:-}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            echo "- ❌ CLOUDFLARE_API_TOKEN: missing" >> "$GITHUB_STEP_SUMMARY"
            config_ok=false
          else
            echo "- ✅ CLOUDFLARE_API_TOKEN: configured (value not displayed)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ ! "${CF_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Repository variable CF_ACCOUNT_ID is missing or is not a 32-character hexadecimal account ID."
            echo "- ❌ CF_ACCOUNT_ID: missing or invalid format" >> "$GITHUB_STEP_SUMMARY"
            config_ok=false
          else
            echo "- ✅ CF_ACCOUNT_ID: configured (value not displayed)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "config_ok=$config_ok" >> "$GITHUB_OUTPUT"
          echo "include_stream=$INCLUDE_STREAM" >> "$GITHUB_OUTPUT"

      - name: Stop safely if configuration is incomplete
        if: steps.config.outputs.config_ok != 'true'
        run: |
          echo "Correct the missing repository secret/variable, then rerun this workflow."
          exit 1

      - name: Verify token and inspect Worker, D1, R2, and optional Stream
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          INCLUDE_STREAM: ${{ steps.config.outputs.include_stream }}
        shell: bash
        run: |
          set -uo pipefail
          base="https://api.cloudflare.com/client/v4"
          failures=0

          api_check() {
            local label="$1" path="$2" expected="$3"
            local body_file code message
            body_file="$(mktemp)"
            code="$(curl -sS --max-time 25 -o "$body_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Accept: application/json" "$base$path" || true)"
            message="$(jq -r '[(.errors // [])[]? | .message] | join("; ")' "$body_file" 2>/dev/null || true)"
            if [[ "$code" == "$expected" ]] && jq -e '.success == true' "$body_file" >/dev/null 2>&1; then
              echo "PASS: $label (HTTP $code)"
              echo "- ✅ $label — HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            else
              failures=$((failures + 1))
              case "$code" in
                401) diagnosis="Token rejected: confirm CLOUDFLARE_API_TOKEN is current and active." ;;
                403) diagnosis="Permission or account-scope failure: grant the required read permission for this endpoint." ;;
                404) diagnosis="Resource or endpoint not found; verify account scope and resource configuration." ;;
                000|"") diagnosis="Network/request failure; retry the audit." ;;
                *) diagnosis="Cloudflare API returned HTTP $code." ;;
              esac
              echo "::warning::$label failed. $diagnosis ${message:+Cloudflare detail: $message}"
              {
                echo "- ❌ $label — HTTP ${code:-unknown}"
                echo "  - Diagnosis: $diagnosis"
                if [[ -n "$message" ]]; then echo "  - Cloudflare detail: $message"; fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$body_file"
          }

          # Token validity is checked separately so 401 can be distinguished from missing endpoint permissions.
          api_check "Cloudflare token verification" "/user/tokens/verify" "200"
          api_check "Worker Scripts inventory (Workers Scripts Read)" "/accounts/$CF_ACCOUNT_ID/workers/scripts" "200"
          api_check "D1 database inventory (D1 Read)" "/accounts/$CF_ACCOUNT_ID/d1/database" "200"
          api_check "R2 bucket inventory (Workers R2 Storage Read)" "/accounts/$CF_ACCOUNT_ID/r2/buckets" "200"

          # Stream endpoint is only queried when selected. GET only; no live input is created.
          if [[ "$INCLUDE_STREAM" == "true" ]]; then
            api_check "Cloudflare Stream live-input inventory (Stream Read)" "/accounts/$CF_ACCOUNT_ID/stream/live_inputs" "200"
          else
            echo "- ⏭️ Cloudflare Stream check skipped by workflow input." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Expected resources" >> "$GITHUB_STEP_SUMMARY"
          echo 'The configured Worker is `pyonglive-api`, D1 database is `pyonglive-db`, and R2 bucket is `pyonglive-assets`.' >> "$GITHUB_STEP_SUMMARY"
          echo "This audit checks API access/inventory; it does not deploy the Worker or prove ingest/playback/replay." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failures" -gt 0 ]]; then
            echo "**Result: $failures check(s) failed.** See the per-check diagnosis above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**Result: all selected Cloudflare API access checks passed.** Resource-name matching and live-stream end-to-end testing are separate checks." >> "$GITHUB_STEP_SUMMARY"
